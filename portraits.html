<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3年3組・立ち絵一覧</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6edf2;color:#18394b;font:16px system-ui,sans-serif}header{padding:14px 20px;background:#143b4e;color:white}header a{color:white}h1{font-size:1.2rem;margin:0 0 8px}nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button{font:inherit;min-height:40px;padding:6px 12px;border:1px solid #879aa8;border-radius:6px;background:white;color:#18394b}main{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px}figure{margin:0;min-width:0}figcaption{text-align:center;font-weight:bold;padding:8px;background:white}.sprite{height:min(72vh,690px);overflow:hidden;background-color:#b8c7d3;background-image:conic-gradient(#e6edf2 25%,transparent 0 50%,#e6edf2 0 75%,transparent 0);background-size:24px 24px}.sprite img{width:100%;height:100%;object-fit:contain;object-position:center top}.zoom .sprite img{height:auto;transform:scale(2.5);transform-origin:50% 0}.dark .sprite{background:#14283e}.light .sprite{background:#fff}.school .sprite{background:url(assets/backgrounds/class.png) center/cover}footer{padding:0 20px 16px;color:#456} @media(max-width:800px){main{grid-template-columns:repeat(3,minmax(0,1fr))}.sprite{height:42vh}}
</style>
<header><h1>3年3組・立ち絵と6つの表情</h1><nav><a href="index.html">ゲームへ</a><select id="person" aria-label="キャラクター"></select><select id="backdrop" aria-label="背景"><option value="">市松模様</option><option value="school">教室</option><option value="dark">暗い背景</option><option value="light">白い背景</option></select><button id="zoom">顔・輪郭を拡大</button><button id="prev">前の人</button><button id="next">次の人</button></nav></header>
<main id="portraits"></main><footer>15人 × 通常・笑顔・照れ・不満・驚き・悲しみ。背景を切り替えて輪郭も確認できます。</footer>
<script src="characters-data.js"></script><script>
const faces={normal:'通常',smile:'笑顔',blush:'照れ',angry:'不満',surprised:'驚き',sad:'悲しみ'},people=window.CHARACTERS,select=document.getElementById('person');
select.innerHTML=people.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
function show(){const c=people.find(c=>c.id===select.value);document.getElementById('portraits').innerHTML=Object.entries(faces).map(([f,label])=>`<figure><figcaption>${label}</figcaption><div class="sprite"><img src="assets/chars-alpha/${c.id}_${f}.png?v=20261108-alpha90" alt="${c.name}・${label}"></div></figure>`).join('')}
select.onchange=show;document.getElementById('backdrop').onchange=e=>{for(const k of ['school','dark','light'])document.body.classList.remove(k);if(e.target.value)document.body.classList.add(e.target.value)};document.getElementById('zoom').onclick=e=>{const zoom=document.body.classList.toggle('zoom');e.target.textContent=zoom?'全身を見る':'顔・輪郭を拡大'};function step(n){select.selectedIndex=(select.selectedIndex+n+people.length)%people.length;show()}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);show();
</script></html>
